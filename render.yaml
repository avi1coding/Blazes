services:
  - type: web
    name: blazes
    runtime: node
    branch: main
    autoDeploy: true
    buildCommand: npm run render-build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Signs auth tokens. Changing it signs everyone out, so leave it alone
      # once set. Render generates it on first deploy and keeps it.
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      # Required to verify Stripe webhook signatures. Without it the
      # webhook cannot fulfil a paid upgrade.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CONTACT_EMAIL_USER
        sync: false
      - key: CONTACT_EMAIL_PASS
        sync: false
