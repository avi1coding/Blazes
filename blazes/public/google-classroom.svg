<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Stylised chalkboard mark — green field, three figures. -->
  <rect x="2" y="2" width="44" height="44" rx="8" ry="8" fill="#0F9D58"/>
  <!-- Soft top highlight -->
  <path d="M4 10 a6 6 0 0 1 6-6 h28 a6 6 0 0 1 6 6 v8 H4 z" fill="#57BB8A"/>
  <!-- Center figure (largest, foreground) -->
  <circle cx="24" cy="20" r="4.2" fill="#ffffff"/>
  <path d="M16 34 c0-4.4 3.58-7 8-7 s8 2.6 8 7 v3 H16 z" fill="#ffffff"/>
  <!-- Left figure (background) -->
  <circle cx="14" cy="22" r="3" fill="#ffffff" fill-opacity="0.9"/>
  <path d="M9 33 c0-3 2.24-5 5-5 s5 2 5 5 v2 H9 z" fill="#ffffff" fill-opacity="0.9"/>
  <!-- Right figure (background) -->
  <circle cx="34" cy="22" r="3" fill="#ffffff" fill-opacity="0.9"/>
  <path d="M29 33 c0-3 2.24-5 5-5 s5 2 5 5 v2 H29 z" fill="#ffffff" fill-opacity="0.9"/>
  <!-- Chalkboard ledge along the bottom -->
  <rect x="6" y="37" width="36" height="3" rx="1" fill="#0a7943"/>
</svg>
